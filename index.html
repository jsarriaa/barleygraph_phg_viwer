<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Barley Pangenome Rail Map</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root {
            /* Light Theme Variables */
            --bg-color: #f4f6f8;
            --text-color: #222222;
            --toolbar-bg: #ffffff;
            --toolbar-border: #dddddd;
            --input-bg: #ffffff;
            --input-border: #bbbbbb;
            --input-text: #222222;
            --status-bg: #e2e8f0;
            --status-text: #333333;
            --dim-text: #666666;
            --ruler-line: #cccccc;
            
            --primary-color: #006b5b;
            --secondary-color: #c2185b;
            --fwd-color: #1b5e20;
            --rev-color: #b71c1c;
            
            /* Darker pipes for light mode */
            --pipe-fill: #d1d5db; 
            --pipe-hover: #9ca3af;
            
            --tooltip-bg: rgba(255, 255, 255, 0.98);
            --tooltip-border: #cccccc;
            --tooltip-text: #222222;
        }

        [data-theme="dark"] {
            /* Dark Theme Variables */
            --bg-color: #121212;
            --text-color: #ffffff;
            --toolbar-bg: #1e1e1e;
            --toolbar-border: #333333;
            --input-bg: #333333;
            --input-border: #555555;
            --input-text: #ffffff;
            --status-bg: #000000;
            --status-text: #aaaaaa;
            --dim-text: #aaaaaa;
            --ruler-line: #555555;
            
            --primary-color: #00ffcc;
            --secondary-color: #ff66cc;
            --fwd-color: #4CAF50;
            --rev-color: #FF5252;
            
            /* Lighter pipes for dark mode */
            --pipe-fill: #2d3748; 
            --pipe-hover: #4a5568;
            
            --tooltip-bg: rgba(0, 0, 0, 0.95);
            --tooltip-border: #444444;
            --tooltip-text: #ffffff;
        }

        body { font-family: sans-serif; margin: 0; background: var(--bg-color); color: var(--text-color); overflow: hidden; transition: background 0.3s, color 0.3s; }
        #toolbar { background: var(--toolbar-bg); border-bottom: 1px solid var(--toolbar-border); z-index: 100; position: relative; padding: 10px 15px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0px 2px 5px rgba(0,0,0,0.05); transition: background 0.3s; }
        .row { display: flex; gap: 15px; align-items: center; }
        
        #viewer { 
            width: 100vw; 
            height: calc(100vh - 100px); 
            cursor: grab; 
            transform: translateZ(0); 
        }
        #viewer:active { cursor: grabbing; }
        
        select, input[type="number"], input[type="text"] { background: var(--input-bg); color: var(--input-text); border: 1px solid var(--input-border); padding: 5px; height: 32px; border-radius: 4px; outline: none; }
        select[multiple] { height: 40px; width: 150px; }
        input[type="number"] { width: 120px; font-family: monospace; }
        input[type="text"] { width: 160px; font-family: monospace; }
        button { background: #3498db; color: white; border: none; padding: 6px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; height: 32px; transition: background 0.2s;}
        button:hover { background: #2980b9; }
        .theme-btn { background: var(--status-bg); color: var(--text-color); border: 1px solid var(--input-border); }
        .theme-btn:hover { background: var(--input-border); }
        
        #status { font-family: monospace; font-size: 13px; padding: 5px 10px; border-radius: 4px; background: var(--status-bg); color: var(--status-text); font-weight: bold;}
        .info-text { font-size: 13px; color: var(--dim-text); }
        
        .ruler-line { stroke: var(--ruler-line); stroke-width: 1px; stroke-dasharray: 4,4; }
        .ruler-text { fill: #f39c12; font-size: 13px; text-anchor: middle; font-family: monospace; font-weight: bold; }
        
        /* Annotations - Increased font size for legibility */
        .anno-text { fill: var(--primary-color); font-size: 15px; text-anchor: middle; font-weight: bold; cursor: pointer; transition: fill 0.2s, opacity 0.2s; }
        .anno-text:hover { text-decoration: underline; opacity: 0.7; }
        .panbart-text { fill: var(--secondary-color); font-size: 15px; text-anchor: middle; font-weight: bold; cursor: pointer; transition: fill 0.2s, opacity 0.2s; }
        .panbart-text:hover { text-decoration: underline; opacity: 0.7; }
        
        /* Connectors and Pipes */
        .transition-ribbon { fill: var(--pipe-fill); cursor: pointer; transition: fill 0.2s; }
        .base-pipe { fill: var(--pipe-fill); transition: fill 0.2s; }
        
        #tooltip { position: absolute; background: var(--tooltip-bg); padding: 12px; border-radius: 8px; border: 1px solid var(--tooltip-border); color: var(--tooltip-text); font-size: 13px; max-width: 400px; display: none; pointer-events: none; z-index: 10; box-shadow: 0px 8px 20px rgba(0,0,0,0.15); line-height: 1.4; transition: background 0.3s, color 0.3s; }
        
        #version-tag { position: fixed; bottom: 10px; right: 15px; background: var(--tooltip-bg); padding: 5px 10px; border-radius: 4px; font-family: monospace; font-size: 11px; color: var(--dim-text); border: 1px solid var(--tooltip-border); z-index: 1000; pointer-events: none; }
    </style>
</head>
<body>

<div id="toolbar">
    <div class="row">
        <strong>Pangenome Map</strong>
        
        <label>Load Chromosome:</label>
        <select id="chromSelect">
            <option value="">-- Select --</option>
            <option value="Pan76_tube_map_chr1H.json.gz">chr1H</option>
            <option value="Pan76_tube_map_chr2H.json.gz">chr2H</option>
            <option value="Pan76_tube_map_chr3H.json.gz">chr3H</option>
            <option value="Pan76_tube_map_chr4H.json.gz">chr4H</option>
            <option value="Pan76_tube_map_chr5H.json.gz">chr5H</option>
            <option value="Pan76_tube_map_chr6H.json.gz">chr6H</option>
            <option value="Pan76_tube_map_chr7H.json.gz">chr7H</option>
        </select>
        
        <div id="status">Initializing...</div>
        
        <label style="margin-left:auto;">Highlight Genomes:</label>
        <select id="samplePicker" multiple></select>
        
        <button class="theme-btn" id="themeToggle" onclick="toggleTheme()">🌙 Dark Mode</button>
    </div>
    <div class="row">
        <span class="info-text">🖱️ Click & Drag to Pan | Scroll to Zoom</span>
        
        <div style="margin-left:auto; display:flex; gap: 10px; align-items:center;">
            <label class="info-text">Find Gene:</label>
            <input type="text" id="geneSearch" placeholder="e.g. 1HG0000030">
            <button onclick="searchGene()">Find</button>
        </div>

        <div style="margin-left:15px; border-left: 1px solid var(--toolbar-border); padding-left: 15px; display:flex; gap: 10px; align-items:center;">
            <label class="info-text">Jump Coord:</label>
            <input type="number" id="jumpStart" placeholder="Start Base">
            <input type="number" id="jumpEnd" placeholder="End Base (Opt)">
            <button onclick="jumpToRegion()">Go</button>
        </div>
    </div>
</div>

<div id="viewer"></div>
<div id="tooltip"></div>
<div id="version-tag">Build: 2026-09-15 | v2.8 (PanBarLex & Gene Stacking)</div>

<script>
    function toggleTheme() {
        const doc = document.documentElement;
        const toggleBtn = document.getElementById('themeToggle');
        if (doc.getAttribute('data-theme') === 'light') {
            doc.setAttribute('data-theme', 'dark');
            toggleBtn.innerText = '☀️ Light Mode';
        } else {
            doc.setAttribute('data-theme', 'light');
            toggleBtn.innerText = '🌙 Dark Mode';
        }
    }

    const width = window.innerWidth, height = window.innerHeight - 100;
    const svg = d3.select("#viewer").append("svg").attr("width", width).attr("height", height);
    const g = svg.append("g");
    const tooltip = d3.select("#tooltip");
    const statusDiv = document.getElementById("status");

    let globalData = null;       
    let currentTransform = d3.zoomIdentity.translate(50, height / 2 + 100); 
    let pendingJump = null;

    const colWidth = 300; 
    const transitionWidth = 100; 
    const railWidth = colWidth - transitionWidth;
    const colorScale = d3.scaleOrdinal(d3.schemeSet2);
    
    const lineGen = d3.linkHorizontal().x(d => d.x).y(d => d.y);

    let globalGeneIndex = [];

    function updateURLParams(params) {
        const url = new URL(window.location);
        url.searchParams.delete('gene');
        url.searchParams.delete('chrom');
        url.searchParams.delete('start');
        url.searchParams.delete('end');
        for (const [key, value] of Object.entries(params)) {
            if (value) url.searchParams.set(key, value);
        }
        window.history.pushState({}, '', url);
    }

    function checkUrlOnLoad() {
        const urlParams = new URLSearchParams(window.location.search);
        const geneParam = urlParams.get('gene');
        const chromParam = urlParams.get('chrom');
        const startParam = urlParams.get('start');
        const endParam = urlParams.get('end');

        if (geneParam) {
            document.getElementById('geneSearch').value = geneParam;
            searchGene();
        } else if (chromParam && startParam) {
            const chromSelect = document.getElementById('chromSelect');
            let targetValue = "";
            for (let i = 0; i < chromSelect.options.length; i++) {
                if (chromSelect.options[i].text === chromParam) {
                    targetValue = chromSelect.options[i].value;
                    break;
                }
            }
            if (targetValue) {
                chromSelect.value = targetValue;
                document.getElementById('jumpStart').value = startParam;
                if (endParam) document.getElementById('jumpEnd').value = endParam;
                
                pendingJump = { start: parseInt(startParam), end: endParam ? parseInt(endParam) : null, gene: null };
                chromSelect.dispatchEvent(new Event('change'));
            }
        }
    }

    async function loadGeneIndexes() {
        const files = [ { file: "pgsb_genes.tsv", source: "PGSB" }, { file: "panbart_graph.tsv", source: "PanBaRT" } ];
        for (const item of files) {
            try {
                const response = await fetch(item.file + "?t=" + new Date().getTime());
                if (!response.ok) continue;
                const text = await response.text();
                text.split("\n").forEach(line => {
                    const parts = line.trim().split(/\s+/);
                    if (parts.length < 4) return;
                    const start = parseInt(parts[2]), end = parseInt(parts[3]);
                    if (isNaN(start) || isNaN(end)) return;
                    globalGeneIndex.push({
                        name: parts[0], graphChrom: parts[1], chrom: parts[1].split("_")[0],
                        start: start, end: end, source: item.source
                    });
                });
            } catch (err) {}
        }
        statusDiv.style.color = "var(--primary-color)";
        statusDiv.innerText = `Ready. Linked ${globalGeneIndex.length} genes.`;
        checkUrlOnLoad();
    }

    loadGeneIndexes();

    const zoom = d3.zoom().scaleExtent([0.02, 10]).on("zoom", e => {
        g.attr("transform", e.transform);
        currentTransform = e.transform;
        tooltip.style("display", "none");
        if (globalData) renderVisibleChunk();
    });
    svg.call(zoom).call(zoom.transform, currentTransform);

    document.getElementById('chromSelect').addEventListener('change', e => {
        const fileUrl = e.target.value;
        if (!fileUrl) return;
        
        statusDiv.style.color = "#d35400";
        statusDiv.innerText = `Downloading data...`;

        const loadStartTime = performance.now();
        fetch(fileUrl + "?t=" + new Date().getTime())
            .then(response => {
                const ds = new DecompressionStream('gzip');
                const decompressedStream = response.body.pipeThrough(ds);
                return new Response(decompressedStream).json();
            })
            .then(data => {
                statusDiv.innerText = "Extracting sequences...";
                globalData = data;
                
                const sampSelect = d3.select("#samplePicker");
                sampSelect.selectAll("option").remove();
                sampSelect.selectAll("option").data(globalData.samples).enter().append("option").attr("value", d => d).text(d => d);

                computeChromosomeLayout(loadStartTime).then(() => {
                    if (pendingJump) {
                        executeJump(pendingJump.start, pendingJump.end, pendingJump.gene);
                        pendingJump = null;
                    } else {
                        svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(50, height / 2 + 100).scale(1));
                    }
                });
            });
    });

    function searchGene() {
        const queryInput = document.getElementById('geneSearch').value.trim();
        const query = queryInput.toLowerCase();
        if(!query) return;

        if (globalGeneIndex.length > 0) {
            const match = globalGeneIndex.find(g => g.name.toLowerCase().includes(query));
            if (match) {
                updateURLParams({ gene: match.name });
                const expectedFile = `Pan76_tube_map_${match.chrom}.json.gz`;
                const chromSelect = document.getElementById('chromSelect');
                if (chromSelect.value !== expectedFile) {
                    chromSelect.value = expectedFile;
                    pendingJump = { start: match.start, end: match.end, gene: match.name };
                    chromSelect.dispatchEvent(new Event('change')); 
                } else {
                    executeJump(match.start, match.end, match.name);
                }
            } else {
                showError(`Gene '${queryInput}' not found in database.`);
            }
        }
    }

    function showError(msg) {
        statusDiv.style.color = "#c62828";
        statusDiv.innerText = msg;
        setTimeout(() => { statusDiv.style.color = "var(--dim-text)"; statusDiv.innerText = "Ready."; }, 4000);
    }

    document.getElementById("geneSearch").addEventListener("keypress", function(event) {
        if (event.key === "Enter") { event.preventDefault(); searchGene(); }
    });

    document.getElementById('samplePicker').addEventListener('change', () => { if(globalData) updateHighlights(); });

    function jumpToRegion() {
        const start = parseInt(document.getElementById('jumpStart').value);
        const end = parseInt(document.getElementById('jumpEnd').value);
        const chromSelect = document.getElementById('chromSelect');
        const chromText = chromSelect.options[chromSelect.selectedIndex].text;
        if(start && !isNaN(start)) {
            updateURLParams({ chrom: chromText !== "-- Select --" ? chromText : "", start: start, end: end || "" });
            executeJump(start, end);
        }
    }

    function executeJump(start, end, geneName = null) {
        if(!globalData) return;
        let targetIdx = globalData.columns.findIndex(c => c.start >= start);
        if (targetIdx === -1) targetIdx = globalData.columns.length - 1;

        const targetX = targetIdx * colWidth;
        svg.transition().duration(1000).call(zoom.transform, d3.zoomIdentity.translate(width/2 - targetX, height/2 + 100).scale(1));
        statusDiv.style.color = "var(--primary-color)";
        statusDiv.innerText = `Viewing ${geneName ? geneName : 'Region'} near ${start}`;
    }
    
    function findColumnForAnnotation(gene) {
        if (!globalData || !globalData.columns) return -1;
        return globalData.columns.findIndex(c => gene.start >= parseInt(c.start) && gene.start <= parseInt(c.end));
    }

    let lastRenderStart = -1;
    let lastRenderEnd = -1;

    async function computeChromosomeLayout(loadStartTime) {
        lastRenderStart = -1;
        lastRenderEnd = -1;
        
        const nodeMap = new Map();
        const cols = d3.group(globalData.segments, d => d.col);
        const incomingMap = d3.group(globalData.transitions, d => d.target);

        const minThickness = 6; 
        const pipeGap = 15; 

        statusDiv.style.color = "#d35400";
        statusDiv.innerText = "Indexing thickness mappings...";

        await new Promise(r => setTimeout(r, 10));

        globalData.segments.forEach(d => {
            d.pos_samps = d.samples.filter(s => d.strands && d.strands[s] === '+');
            d.neg_samps = d.samples.filter(s => d.strands && d.strands[s] === '-');
            d.base_t = minThickness + ((d.samples.length - 1) * 2.666); 
            d.is_mixed = d.pos_samps.length > 0 && d.neg_samps.length > 0;
            d.inner_t = 2.5; 
            nodeMap.set(d.id, d);
        });

        let prevBackboneY = 0; 
        const totalCols = globalData.columns.length;
        const chunkSize = 500; 
        const calcStartTime = performance.now();

        for (let i = 0; i < totalCols; i += chunkSize) {
            const chunk = globalData.columns.slice(i, i + chunkSize);
            
            chunk.forEach((colInfo, localIndex) => {
                const visualIndex = i + localIndex;
                let segsInCol = cols.get(colInfo.col) || [];
                
                if (visualIndex === 0) {
                    segsInCol.sort((a, b) => b.samples.length - a.samples.length);
                    let currentY = 0;
                    segsInCol.forEach(n => {
                        n.y = currentY + n.base_t / 2;
                        currentY += n.base_t + pipeGap;
                    });
                    const shift = currentY / 2;
                    segsInCol.forEach(n => n.y -= shift);
                    prevBackboneY = segsInCol.length > 0 ? segsInCol[0].y : 0; 
                } else {
                    segsInCol.forEach(n => {
                        const incoming = incomingMap.get(n.id) || [];
                        if (incoming.length > 0) {
                            let bestTrans = incoming[0];
                            for(let j = 1; j < incoming.length; j++) {
                                if (incoming[j].samples.length > bestTrans.samples.length) bestTrans = incoming[j];
                            }
                            const sourceNode = nodeMap.get(bestTrans.source);
                            n.idealY = (sourceNode && sourceNode.y !== undefined) ? sourceNode.y : prevBackboneY;
                        } else {
                            n.idealY = prevBackboneY;
                        }
                    });

                    segsInCol.sort((a, b) => a.idealY - b.idealY);

                    let currentY = 0;
                    segsInCol.forEach(n => {
                        n.y = currentY + n.base_t / 2;
                        currentY += n.base_t + pipeGap;
                    });

                    let heaviestNode = segsInCol[0];
                    segsInCol.forEach(n => {
                        if (n.samples.length > heaviestNode.samples.length) heaviestNode = n;
                    });

                    let targetY = prevBackboneY;
                    const incoming = incomingMap.get(heaviestNode.id) || [];
                    if (incoming.length > 0) {
                        let bestTrans = incoming[0];
                        for(let j = 1; j < incoming.length; j++) {
                            if (incoming[j].samples.length > bestTrans.samples.length) bestTrans = incoming[j];
                        }
                        const sourceNode = nodeMap.get(bestTrans.source);
                        if (sourceNode && sourceNode.y !== undefined) targetY = sourceNode.y;
                    }

                    const shift = heaviestNode.y - targetY;
                    segsInCol.forEach(n => n.y -= shift);
                    prevBackboneY = heaviestNode.y;
                }

                const colCenterX = visualIndex * colWidth;
                segsInCol.forEach(n => {
                    n.x1 = colCenterX - railWidth/2;
                    n.x2 = colCenterX + railWidth/2;
                });
            });

            const colsDone = i + chunk.length;
            const progress = Math.min(100, Math.round((colsDone / totalCols) * 100));
            const elapsed = (performance.now() - calcStartTime) / 1000;
            const colsPerSec = colsDone / elapsed;
            const remainingCols = totalCols - colsDone;
            let eta = remainingCols / colsPerSec;
            if (!isFinite(eta) || eta < 0) eta = 0;

            statusDiv.style.color = "#3498db";
            statusDiv.innerText = `Calculating Layout: ${progress}% (ETA: ${eta.toFixed(1)}s)`;
            
            await new Promise(r => setTimeout(r, 1));
        }

        globalData.nodeMap = nodeMap;
        renderVisibleChunk();
        
        const totalTime = ((performance.now() - loadStartTime) / 1000).toFixed(2);
        statusDiv.style.color = "var(--primary-color)";
        statusDiv.innerText = `Success: Placed ${totalCols} blocks in ${totalTime}s`;
    }

    function renderVisibleChunk() {
        if (!globalData) return;
        
        const minX = -currentTransform.x / currentTransform.k;
        const maxX = (width - currentTransform.x) / currentTransform.k;
        
        const currentViewStart = Math.floor(minX / colWidth);
        const currentViewEnd = Math.ceil(maxX / colWidth);

        const safeLeft = (lastRenderStart === 0) || (currentViewStart > lastRenderStart + 5);
        const safeRight = (lastRenderEnd === globalData.columns.length - 1) || (currentViewEnd < lastRenderEnd - 5);

        if (lastRenderStart !== -1 && safeLeft && safeRight) return; 

        const buffer = 40; 
        const startVisIdx = Math.max(0, currentViewStart - buffer);
        const endVisIdx = Math.min(globalData.columns.length - 1, currentViewEnd + buffer);

        lastRenderStart = startVisIdx;
        lastRenderEnd = endVisIdx;

        const viewCols = globalData.columns.slice(startVisIdx, endVisIdx + 1);
        if(viewCols.length === 0) return;
    
        const actualStartCol = viewCols[0].col;
        const actualEndCol = viewCols[viewCols.length-1].col;

        const viewSegs = globalData.segments.filter(s => s.col >= actualStartCol && s.col <= actualEndCol);
        const viewTrans = globalData.transitions.filter(t => {
            const targetColId = parseInt(t.target.split('_')[0].replace('c', ''));
            return targetColId > actualStartCol && targetColId <= actualEndCol;
        });

        g.selectAll("*").remove();

        let localMinY = 0, localMaxY = 0;
        if (viewSegs.length > 0) {
            localMinY = d3.min(viewSegs, d => d.y - d.base_t/2);
            localMaxY = d3.max(viewSegs, d => d.y + d.base_t/2);
        }
        
        const annoTextTopY = localMinY - 110;  
        const rulerTextTopY = localMinY - 60;  
        const rulerLineTopY = localMinY - 40;  
        const rulerLineBotY = localMaxY + 40;

        // Keep track of how high we have stacked genes in each column
        const colGeneOffsets = {}; 
        const geneSpacing = 22; // Pixels to move up for each new gene

        // Rulers & Gene Annotations (PGSB)
        viewCols.forEach(colInfo => {
            const visualIdx = globalData.columns.indexOf(colInfo);
            const colCenterX = visualIdx * colWidth;
            const boundaryX = colCenterX + colWidth/2;

            if(colInfo.col < globalData.columns[globalData.columns.length - 1].col) {
                g.append("line").attr("class", "ruler-line").attr("x1", boundaryX).attr("x2", boundaryX).attr("y1", rulerLineTopY).attr("y2", rulerLineBotY);
                g.append("text").attr("class", "ruler-text").attr("x", boundaryX).attr("y", rulerTextTopY).text(`${colInfo.chrom}:${colInfo.end}`);
            }
            if(visualIdx === 0) {
                const startX = colCenterX - colWidth/2;
                g.append("line").attr("class", "ruler-line").attr("x1", startX).attr("x2", startX).attr("y1", rulerLineTopY).attr("y2", rulerLineBotY);
                g.append("text").attr("class", "ruler-text").attr("x", startX).attr("y", rulerTextTopY).text(`${colInfo.chrom}:${colInfo.start}`);
            }

            if (colInfo.anno) {
                const validAnnos = colInfo.anno.split(',').filter(a => !a.toLowerCase().includes('intergenic'));
                
                validAnnos.forEach(rawGene => {
                    const gene = rawGene.trim();
                    let currentOffset = colGeneOffsets[colCenterX] || 0;
                    let yPos = annoTextTopY - currentOffset;

                    let strandArrow = "";
                    if (colInfo.strand === "+") strandArrow = " →";
                    if (colInfo.strand === "-") strandArrow = " ←";

                    g.append("text").attr("class", "anno-text").attr("x", colCenterX).attr("y", yPos)
                     .attr("transform", `rotate(-30, ${colCenterX}, ${yPos})`).text(gene + strandArrow)
                     .on("mouseover", (e) => {
                         tooltip.style("display", "block").html(`<div style='color:var(--primary-color); margin-bottom:5px;'><strong>PGSB Gene (Click to view on PanBarLex)</strong></div>${gene}<br><span style="color:var(--dim-text);">Strand: ${colInfo.strand || '?'}</span>`);
                     })
                     .on("mousemove", moveTooltip).on("mouseout", hideTooltip)
                     .on("click", () => {
                         window.open(`https://panbarlex.ipk-gatersleben.de/#gene/${gene}`, '_blank');
                     });
                     
                     colGeneOffsets[colCenterX] = currentOffset + geneSpacing;
                });
            }
        });

        // PanBaRT annotations (Stacks directly on top of any PGSB genes in the same column)
        const currentChrom = globalData.columns[0].chrom;
        const viewStart = parseInt(viewCols[0].start);
        const viewEnd = parseInt(viewCols[viewCols.length - 1].end);
        
        const visiblePanBaRT = globalGeneIndex.filter(g => g.source === "PanBaRT" && g.chrom === currentChrom && g.start >= viewStart && g.start <= viewEnd);
        visiblePanBaRT.forEach(gene => {
            const targetIdx = findColumnForAnnotation(gene);
            if (targetIdx === -1) return;
            const colCenterX = targetIdx * colWidth;

            let currentOffset = colGeneOffsets[colCenterX] || 0;
            let yPos = annoTextTopY - currentOffset;

            g.append("text").attr("class", "panbart-text").attr("x", colCenterX).attr("y", yPos)
                .attr("transform", `rotate(-30, ${colCenterX}, ${yPos})`).text(gene.name)
                .on("mouseover", () => {
                    tooltip.style("display", "block").html(`<div style="color:var(--secondary-color); margin-bottom:5px;"><strong>PanBaRT gene (Click to view on PanBarLex)</strong></div><strong>${gene.name}</strong><br>${gene.graphChrom}:${gene.start}-${gene.end}<br>Strand: ${gene.strand || "?"}`);
                }).on("mousemove", moveTooltip).on("mouseout", hideTooltip)
                .on("click", () => { 
                    window.open(`https://panbarlex.ipk-gatersleben.de/#gene/${gene.name}`, '_blank'); 
                });
                
            colGeneOffsets[colCenterX] = currentOffset + geneSpacing;
        });

        // Ribbon Transitions
        const transitionGroup = g.selectAll(".trans-group").data(viewTrans).enter().append("g").attr("class", "trans-group");
        
        transitionGroup.append("path").attr("class", "transition-ribbon")
            .attr("d", d => {
                const src = globalData.nodeMap.get(d.source), tgt = globalData.nodeMap.get(d.target);
                if(!src || !tgt) return "";
                const cpOffset = (tgt.x1 - src.x2) / 2;
                const sTop = src.y - src.base_t / 2;
                const sBot = src.y + src.base_t / 2;
                const tTop = tgt.y - tgt.base_t / 2;
                const tBot = tgt.y + tgt.base_t / 2;
                return `M ${src.x2},${sTop} C ${src.x2 + cpOffset},${sTop} ${tgt.x1 - cpOffset},${tTop} ${tgt.x1},${tTop} L ${tgt.x1},${tBot} C ${tgt.x1 - cpOffset},${tBot} ${src.x2 + cpOffset},${sBot} ${src.x2},${sBot} Z`;
            })
            .on("mouseover", function(e, d) {
                d3.select(this).style("fill", "var(--pipe-hover)");
                const tgtNode = globalData.nodeMap.get(d.target);
                const safeTgtHash = (tgtNode && tgtNode.hash) ? tgtNode.hash.replace(/</g, "&lt;").replace(/>/g, "&gt;") : 'Split/Merge';
                
                tooltip.style("display", "block").html(`
                    <div style="font-family:monospace; color:var(--primary-color); margin-bottom:8px; word-wrap:break-word;"><strong>Transition to ${safeTgtHash}</strong></div>
                    <strong>Total samples: ${d.samples.length}</strong><br><br>
                    <span style="color:var(--dim-text);">${d.samples.slice(0, 15).join(', ')}${d.samples.length > 15 ? '...' : ''}</span>
                `);
            })
            .on("mousemove", moveTooltip)
            .on("mouseout", function() {
                d3.select(this).style("fill", "var(--pipe-fill)");
                hideTooltip();
            });

        // Render Pipes
        const rails = g.selectAll(".rail-group").data(viewSegs).enter().append("g").attr("class", "rail-group")
            .style("cursor", "pointer")
            .on("mouseover", function(e, d) {
                d3.select(this).select(".base-pipe").style("fill", "var(--pipe-hover)"); 
                
                const safeHash = d.hash ? d.hash.replace(/</g, "&lt;").replace(/>/g, "&gt;") : 'Split/Merge';
                
                let tip = `<div style="font-family:monospace; color:var(--primary-color); margin-bottom:8px; word-wrap:break-word;"><strong>${safeHash}</strong></div>`;
                tip += `<strong>Total samples: ${d.samples.length}</strong><br><br>`;
                
                if (d.pos_samps.length > 0) {
                    tip += `<span style="color:var(--fwd-color);">Forward strand (+) = ${d.pos_samps.length}</span><br>`;
                    tip += `<span style="font-size:12px; color:var(--dim-text);">${d.pos_samps.slice(0, 25).join(', ')}${d.pos_samps.length > 25 ? '...' : ''}</span><br><br>`;
                }
                
                if (d.neg_samps.length > 0) {
                    tip += `<span style="color:var(--rev-color);">Reverse strand (-) = ${d.neg_samps.length}</span><br>`;
                    tip += `<span style="font-size:12px; color:var(--dim-text);">${d.neg_samps.slice(0, 25).join(', ')}${d.neg_samps.length > 25 ? '...' : ''}</span><br>`;
                }
                
                tooltip.style("display", "block").html(tip);
            })
            .on("mousemove", moveTooltip)
            .on("mouseout", function() {
                d3.select(this).select(".base-pipe").style("fill", "var(--pipe-fill)"); 
                hideTooltip();
            });

        // Pipe Background Fill
        rails.append("rect").attr("class", "base-pipe")
            .attr("x", d => d.x1).attr("width", d => d.x2 - d.x1)
            .attr("y", d => d.y - d.base_t / 2).attr("height", d => d.base_t);

        // Inner Wires
        rails.each(function(d) {
            const group = d3.select(this);
            const insetX1 = d.x1; 
            const insetX2 = d.x2;

            if (d.is_mixed) {
                const offset = 4;
                group.append("line").attr("class", "inner-wire")
                     .attr("x1", insetX1).attr("x2", insetX2).attr("y1", d.y - offset).attr("y2", d.y - offset)
                     .style("stroke-width", d.inner_t).style("stroke", "#888").style("stroke-linecap", "round").style("pointer-events", "none");
                group.append("line").attr("class", "inner-wire")
                     .attr("x1", insetX1).attr("x2", insetX2).attr("y1", d.y + offset).attr("y2", d.y + offset)
                     .style("stroke-width", d.inner_t).style("stroke", "#888").style("stroke-dasharray", "4,4").style("stroke-linecap", "round").style("pointer-events", "none");
            } else {
                const isRev = d.neg_samps.length > 0;
                const dash = isRev ? "5,5" : "none";
                group.append("line").attr("class", "inner-wire")
                     .attr("x1", insetX1).attr("x2", insetX2).attr("y1", d.y).attr("y2", d.y)
                     .style("stroke-width", d.inner_t).style("stroke", "#888").style("stroke-dasharray", dash).style("stroke-linecap", "round").style("pointer-events", "none");
            }
        });

        window.activeSegs = viewSegs;
        window.activeTrans = viewTrans;
        g.append("g").attr("id", "highlights-layer");
        updateHighlights();
    }

    function updateHighlights() {
        if (!window.activeSegs) return;
        const selected = Array.from(document.getElementById('samplePicker').selectedOptions).map(o => o.value);
        const hlLayer = d3.select("#highlights-layer");
        hlLayer.selectAll("*").remove();

        selected.forEach((sample, idx) => {
            const stackOffset = (idx - (selected.length - 1) / 2) * 3.5; 
            const color = colorScale(sample);

            hlLayer.selectAll(`.hl-r-${idx}`).data(window.activeSegs.filter(s => s.samples.includes(sample))).enter().append("line")
                   .attr("x1", d => d.x1).attr("x2", d => d.x2) 
                   .attr("y1", d => {
                       if (!d.is_mixed) return d.y + stackOffset;
                       const sampleStrand = d.strands ? d.strands[sample] : "+";
                       const offset = 4;
                       return sampleStrand === "-" ? (d.y + offset + stackOffset) : (d.y - offset + stackOffset);
                   })
                   .attr("y2", d => {
                       if (!d.is_mixed) return d.y + stackOffset;
                       const sampleStrand = d.strands ? d.strands[sample] : "+";
                       const offset = 4;
                       return sampleStrand === "-" ? (d.y + offset + stackOffset) : (d.y - offset + stackOffset);
                   })
                   .style("stroke", color).style("stroke-width", 2.5).style("pointer-events", "none")
                   .style("stroke-dasharray", d => (d.strands && d.strands[sample] === "-") ? "4,4" : "none");

            hlLayer.selectAll(`.hl-t-${idx}`).data(window.activeTrans.filter(t => t.samples.includes(sample))).enter().append("path")
                   .attr("d", d => {
                       const src = globalData.nodeMap.get(d.source), tgt = globalData.nodeMap.get(d.target);
                       if(!src || !tgt) return "";
                       return lineGen({source: {x: src.x2, y: src.y}, target: {x: tgt.x1, y: tgt.y}});
                   })
                   .attr("transform", `translate(0, ${stackOffset})`)
                   .style("stroke", color).style("stroke-width", 2.5).style("fill", "none").style("pointer-events", "none");
        });
    }

    function moveTooltip(e) { tooltip.style("left", (e.pageX + 20) + "px").style("top", (e.pageY - 20) + "px"); }
    function hideTooltip() { tooltip.style("display", "none"); }
</script>
</body>
</html>
